services:

  # ============================================================
  # ZOOKEEPER
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/2181' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:9092,
        PLAINTEXT_HOST://localhost:29092

      KAFKA_LISTENERS: >
        PLAINTEXT://0.0.0.0:9092,
        PLAINTEXT_HOST://0.0.0.0:29092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/9092' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # ============================================================
  # ELASTICSEARCH
  # ============================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "9200:9200"

    volumes:
      - es_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200 >/dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  # ============================================================
  # LOG INGESTION SERVICE
  # ============================================================

  log-ingestion-service:
    image: sahil19052004/traceforge-log-ingestion:latest
    container_name: log-ingestion-service

    ports:
      - "8080:8080"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTIC_HOST: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      kafka:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy


  # ============================================================
  # LOG PROCESSOR SERVICE
  # ============================================================

  log-processor-service:
    image: sahil19052004/traceforge-log-processor:latest
    container_name: log-processor-service

    depends_on:
      kafka:
        condition: service_healthy

      elasticsearch:
        condition: service_healthy

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTIC_HOST: http://elasticsearch:9200

    ports:
      - "8081:8081"


  # ============================================================
  # AI SERVICE
  # ============================================================

  ai-service:
    image: sahil19052004/traceforge-ai-service:latest
    container_name: ai-service

    ports:
      - "8000:8000"

    environment:
      ELASTIC_HOST: http://elasticsearch:9200
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}

    depends_on:
      elasticsearch:
        condition: service_healthy


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    image: sahil19052004/traceforge-frontend:latest
    container_name: frontend

    depends_on:
      - ai-service

    ports:
      - "5173:5173"


# ============================================================
# VOLUMES
# ============================================================

volumes:
  es_data: